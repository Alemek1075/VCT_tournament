# Local stack: docker compose up --build  ->  http://localhost:8080
services:
  web:
    build: .
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=vct;Username=vct;Password=vct
      Seed__ImageBaseUrl: /seed-img/
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MSAL_CLIENT_ID: ${MSAL_CLIENT_ID:-}
      PICKEM_ADDRESS: ${PICKEM_ADDRESS:-}
      PICKEM_CHAIN_ID: ${PICKEM_CHAIN_ID:-31337}
      REDIS_URL: redis://redis:6379
      ELASTIC_URL: http://elastic:9200
      RABBITMQ_URL: amqp://vct:vct@rabbitmq:5672
      # throwaway admin for the local / CI stack only (Postman tests log in with it)
      SEED_ADMIN_EMAIL: admin@vct.local
      SEED_ADMIN_PASSWORD: local-admin-123
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      elastic: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: vct
      RABBITMQ_DEFAULT_PASS: vct
    ports: ["5672:5672", "15672:15672"] # 15672 = management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vct
      POSTGRES_USER: vct
      POSTGRES_PASSWORD: vct
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vct"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
