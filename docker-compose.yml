# Local stack: docker compose up --build  ->  http://localhost:8080
services:
  web:
    build: .
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=vct;Username=vct;Password=vct
      Seed__ImageBaseUrl: /seed-img/
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      REDIS_URL: redis://redis:6379
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vct
      POSTGRES_USER: vct
      POSTGRES_PASSWORD: vct
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vct"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
