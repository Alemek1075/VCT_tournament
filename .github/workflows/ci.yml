name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build VctHub.slnx -c Release
      - run: dotnet test VctHub.slnx -c Release --no-build --logger "trx;LogFileName=unit.trx" --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/regions && break; sleep 3; done
      - name: Postman / Newman
        run: |
          npx --yes newman@6 run tests/postman/vct-api.postman_collection.json \
            -e tests/postman/local.postman_environment.json \
            --reporters cli,junit --reporter-junit-export newman.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-tests
          path: newman.xml
      - if: failure()
        run: docker compose logs web

  deploy:
    needs: [build, api-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK secret is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
