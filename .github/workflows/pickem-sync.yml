name: pickem sync

# C20: opens new matches in the Sepolia contract and posts results of finished ones.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Alemek1075/VCT_tournament' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync with the site
        working-directory: contracts
        env:
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          SITE_URL: https://vct-hub.onrender.com
        run: |
          if [ -z "$DEPLOYER_KEY" ]; then echo "DEPLOYER_KEY secret is not set, skipping"; exit 0; fi
          npm ci
          npx hardhat run scripts/sync.js --network sepolia
